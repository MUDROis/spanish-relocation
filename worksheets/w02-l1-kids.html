<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Рабочий лист · Урок 4 · Части тела — Школа МУДРО</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f1ea;color:#222;padding:20px;font-size:14px;line-height:1.5}
  .sheet{max-width:820px;margin:0 auto;background:#fff;padding:34px 42px;box-shadow:0 4px 20px rgba(0,0,0,.15);border-radius:6px}
  .head{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #2A9D8F;padding-bottom:10px;margin-bottom:14px}
  .head .logo{font-weight:800;font-size:15px}
  .head .tag{background:#2A9D8F;color:#fff;border-radius:999px;padding:4px 14px;font-weight:800;font-size:12px}
  h1{font-size:21px;margin:6px 0 4px}
  .sub{color:#666;font-size:12.5px;margin-bottom:12px}
  .name-row{display:flex;gap:20px;margin-bottom:16px;font-weight:700}
  .w{display:inline-block;min-width:150px;border-bottom:1.6px dashed #888;height:18px;vertical-align:bottom}
  .task{margin-bottom:18px;break-inside:avoid;page-break-inside:avoid}
  .task h2{font-size:15px;margin-bottom:8px}
  .task h2 .num{display:inline-block;background:#2A9D8F;color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-size:12px;margin-right:6px}
  .star{color:#E8604C;font-weight:800}
  .bank{background:#f0f7f5;border:1.5px dashed #2A9D8F;border-radius:8px;padding:6px 12px;font-weight:700;margin-bottom:8px;font-size:13px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px}
  .item{display:flex;align-items:flex-end;gap:8px;margin:4px 0}
  .item .emo{font-size:20px}
  .art{display:inline-block;width:26px;height:26px;border:2px solid #444;border-radius:50%;margin-right:6px;vertical-align:middle}
  .hint{font-size:11.5px;color:#777}
  .opt{border:1.5px solid #999;border-radius:999px;padding:1px 8px;margin:0 3px;font-weight:700}
  .line{border-bottom:1.6px dashed #888;height:26px;margin:5px 0}
  .match{display:flex;justify-content:space-between;gap:20px}
  .match ul{list-style:none;width:48%}
  .match li{margin:5px 0;font-weight:600}
  .ans-box{display:inline-block;width:24px;height:22px;border:1.6px solid #444;border-radius:5px;text-align:center;margin-right:8px;font-weight:800}
  .scale-dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid #333;vertical-align:middle;margin-right:6px}
  .g{background:#c8e6c9}.y{background:#fff3c0}.r{background:#ffcdd2}
  .smile{font-size:30px;margin:0 12px}
  .dialogue{margin:8px 0;font-size:13.5px;line-height:2}
  .dialogue .es{font-weight:700}
  .dialogue .ru{color:#666;font-style:italic;font-size:12px}
  .pb{page-break-before:always}
  .cut{border-top:2px dashed #999;margin-top:22px;padding-top:12px;font-size:12px;color:#555}
  .cut b{color:#2A9D8F}
  .answers-page{page-break-before:always;margin-top:0;padding-top:14px}
  .answers-page h2{font-size:16px;color:#2A9D8F;margin-bottom:12px}
  .answers-page .ans-item{margin-bottom:8px;font-size:13px;line-height:1.6}
  .no-print{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px auto 20px}
  .no-print button{background:#E8604C;color:#fff;border:none;border-radius:12px;padding:12px 28px;font-size:15px;font-weight:800;cursor:pointer}
  .no-print button:hover{background:#d64d3a}
  
  /* Оптимизация для печати на Mac и других системах */
  @media print{
    body{background:#fff;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .sheet{box-shadow:none;max-width:none;width:100%;padding:0;margin:0;border-radius:0}
    .no-print{display:none}
    @page{size:A4;margin:10mm}
    .task{margin-bottom:12px;break-inside:auto;page-break-inside:auto}
    h1,h2,h3{break-after:avoid}
    img{break-inside:avoid}
    p{orphans:3;widows:3}
  }
</style>
</head>
