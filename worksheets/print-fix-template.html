<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Шаблон рабочего листа с улучшенной печатью</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f1ea;color:#222;padding:20px;font-size:14px;line-height:1.5}
  .sheet{max-width:820px;margin:0 auto;background:#fff;padding:34px 42px;box-shadow:0 4px 20px rgba(0,0,0,.15);border-radius:6px}
  
  /* Кнопки управления */
  .no-print{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px auto 20px}
  .no-print button{background:#E8604C;color:#fff;border:none;border-radius:12px;padding:12px 28px;font-size:15px;font-weight:800;cursor:pointer}
  .no-print button:hover{background:#d64d3a}
  
  /* Стили для печати - оптимизировано для Mac */
  @media print{
    body{
      background:#fff;
      padding:0;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
      color-adjust:exact;
    }
    .sheet{
      box-shadow:none;
      max-width:none;
      width:100%;
      padding:0;
      margin:0;
      border-radius:0;
    }
    .no-print{display:none}
    
    /* Убираем жесткие разрывы страниц - контент течет естественно */
    @page{
      size:A4;
      margin:10mm;
    }
    
    /* Разрешаем браузеру автоматически распределять контент */
    .task, .ex{
      break-inside:auto;
      page-break-inside:auto;
      margin-bottom:12px;
    }
    
    h1,h2,h3{break-after:avoid}
    img{break-inside:avoid}
    p{orphans:3;widows:3}
  }
  
  /* Для экранного отображения оставляем разрывы опциональными */
  @media screen{
    .sheet{
      page-break-after:auto;
      break-after:auto;
      margin-bottom:20px;
    }
  }
</style>
</head>
